<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1242px;height:1660px;overflow:hidden;background:#f2ece0}
  .cover{
    width:1242px;height:1660px;background:#f4efe2;color:#16342a;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    padding:104px 92px;display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }
  .paper{position:absolute;inset:0;opacity:.5;
    background-image:
      repeating-linear-gradient(90deg,rgba(120,105,80,.05) 0 1px,transparent 1px 7px),
      repeating-linear-gradient(0deg,rgba(120,105,80,.045) 0 1px,transparent 1px 9px);
  }
  .blot{position:absolute;right:-160px;top:-180px;width:620px;height:620px;border-radius:50%;background:rgba(45,95,79,.05)}
  .kicker{font-size:40px;letter-spacing:.34em;font-weight:700;color:#2d5f4f;position:relative;z-index:2}
  .krule{width:132px;height:6px;background:#b23a2f;margin-top:26px;position:relative;z-index:2}

  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2;padding-top:90px}
  .l1{font-size:88px;font-weight:600;letter-spacing:.05em;line-height:1.2;color:rgba(22,52,42,.5)}
  .l2{font-size:138px;font-weight:900;letter-spacing:0;line-height:1.1;color:#123024;margin-top:22px;white-space:nowrap}
  .hl{color:#b23a2f}

  .sealwrap{display:flex;align-items:flex-end;gap:38px;margin-top:76px}
  .seal{
    width:176px;height:176px;background:#b23a2f;border-radius:12px;
    color:#f7ece0;display:flex;align-items:center;justify-content:center;
    font-size:66px;font-weight:800;letter-spacing:.06em;line-height:1.05;
    text-align:center;transform:rotate(-4deg);
    box-shadow:0 8px 22px rgba(178,58,47,.24);
  }
  .sealnote{font-size:42px;font-weight:600;letter-spacing:.05em;color:rgba(22,52,42,.58);line-height:1.5;padding-bottom:16px}

  .bigemoji{position:absolute;right:66px;bottom:176px;font-size:290px;line-height:1;z-index:3;
    font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
  .foot{display:flex;align-items:center;font-size:38px;color:rgba(22,52,42,.55);position:relative;z-index:2}
  .foot .name{font-weight:800;letter-spacing:.14em;color:#16342a}
  .foot .rule{flex:1;height:2px;background:rgba(22,52,42,.16);margin:0 30px}
</style>
</head>
<body>
  <div class="cover">
    <div class="paper"></div><div class="blot"></div>
    <div class="kicker">转行中医实录</div>
    <div class="krule"></div>
    <div class="mid">
      <div class="l1">口罩期间，全家都阳了</div>
      <div class="l2"><span class="hl">两块九毛钱</span></div>
      <div class="sealwrap">
        <div class="seal">退烧</div>
        <div class="sealnote">下午喝下那碗药<br>当晚全家的烧都退了</div>
      </div>
    </div>
    <div class="bigemoji">🍵</div>
    <div class="foot">
      <span class="name">学中医的凯</span>
      <span class="rule"></span>
    </div>
  </div>
</body>
</html>
