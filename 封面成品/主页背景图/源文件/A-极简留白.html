<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1125px;height:633px;overflow:hidden;background:#f2ece0}
  .bg{width:1125px;height:633px;background:#f4efe2;position:relative;overflow:hidden;
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#16342a}
  .paper{position:absolute;inset:0;opacity:.5;
    background-image:
      repeating-linear-gradient(90deg,rgba(120,105,80,.05) 0 1px,transparent 1px 7px),
      repeating-linear-gradient(0deg,rgba(120,105,80,.045) 0 1px,transparent 1px 9px);
  }
  .blot1{position:absolute;right:-180px;top:-210px;width:660px;height:660px;border-radius:50%;background:radial-gradient(circle,rgba(45,95,79,.08) 0%,rgba(45,95,79,.035) 45%,rgba(45,95,79,0) 72%)}
  .blot2{position:absolute;left:-240px;bottom:-280px;width:580px;height:580px;border-radius:50%;background:radial-gradient(circle,rgba(178,58,47,.07) 0%,rgba(178,58,47,.028) 45%,rgba(178,58,47,0) 72%)}
  .center{position:absolute;left:0;right:0;top:188px;text-align:center;z-index:2}
  .kicker{font-size:50px;font-weight:700;letter-spacing:.44em;color:#2d5f4f;text-indent:.44em}
  .krule{width:92px;height:5px;background:#b23a2f;margin:26px auto 0}
  .sub{margin-top:26px;font-size:25px;letter-spacing:.28em;color:rgba(22,52,42,.42);text-indent:.28em}
  .seal{position:absolute;right:98px;top:180px;width:98px;height:98px;background:#b23a2f;border-radius:8px;
    color:#f7ece0;display:flex;align-items:center;justify-content:center;
    font-size:52px;font-weight:800;transform:rotate(-5deg);z-index:3;
    box-shadow:0 7px 18px rgba(178,58,47,.22)}
</style>
</head>
<body>
  <div class="bg">
    <div class="paper"></div><div class="blot1"></div><div class="blot2"></div>
    <div class="center">
      <div class="kicker">转行中医实录</div>
      <div class="krule"></div>
      <div class="sub">互联网 10 年 · 备考实录</div>
    </div>
    <div class="seal">凯</div>
  </div>
</body>
</html>
