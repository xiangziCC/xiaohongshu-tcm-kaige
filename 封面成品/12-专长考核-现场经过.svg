<svg id="inside" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 1660" role="img" aria-label="专长考核现场经过"><rect width="1242" height="1660" fill="#f4efe2"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="92" y="145" fill="#2d5f4f" font-size="40" font-weight="700" letter-spacing="8">那天到底怎么答的</text><g fill="#16342a" font-size="76" font-weight="900"><text x="92" y="295">有东西能讲</text><text x="92" y="390">但我没有讲出来</text></g><g font-size="44" fill="#16342a"><g transform="translate(92 485)"><rect width="1058" height="190" rx="14" fill="#fffdf8"/><text x="32" y="62" fill="#b23a2f" font-weight="800">① 考前，老师教我</text><text x="32" y="128">专长不要说太多</text><text x="32" y="177">说药渣泡脚就行</text></g><g transform="translate(92 713)"><rect width="1058" height="190" rx="14" fill="#fffdf8"/><text x="32" y="62" fill="#b23a2f" font-weight="800">② 现场，考官打断我</text><text x="32" y="128">前面的内容不用背了</text><text x="32" y="177">只说你的特长就行</text></g><g transform="translate(92 941)"><rect width="1058" height="190" rx="14" fill="#fffdf8"/><text x="32" y="62" fill="#b23a2f" font-weight="800">③ 我按老师教的说了</text><text x="32" y="128">药渣泡脚</text><text x="32" y="177">考官说可以了，考试结束</text></g></g><path d="M92 1200H1150" stroke="#b23a2f" stroke-width="3"/><g fill="#16342a" font-size="43" font-weight="700"><text x="92" y="1280">我当时觉得：前面的分够了。</text><text x="92" y="1360">后来看到的批语却是：</text><text x="92" y="1430" fill="#b23a2f">“该生没有临床经验，不予通过。”</text></g><text x="92" y="1548" fill="#2d5f4f" font-size="38" font-weight="800">学中医的凯</text><path d="M390 1533H1150" stroke="#16342a" stroke-opacity=".16" stroke-width="2"/></g></svg>
